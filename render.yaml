services:
  - type: web
    name: infotech-backend
    env: python
    repo: https://github.com/nancykimberly/gestion_materiel_InfoTech.git
    branch: main
    root: Back
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_zcxKFH3sD8Xi@ep-holy-dust-b1zo93ub-pooler.c-5.eu-central-1.aws.neon.tech/neondb?sslmode=require"
        sync: false
      - key: JWT_SECRET_KEY
        value: "une-cle-secrete-longue-et-aleatoire"
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
        sync: false
      # database is provided via the explicit DATABASE_URL above
    postDeploy: alembic upgrade head
